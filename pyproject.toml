[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedcast-la"
version = "0.1.0"
description = "Shared METR-LA data and reproducible traffic forecasting experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "tables>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["traffic*"]
